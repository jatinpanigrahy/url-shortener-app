<div id="qrModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141413] shadow-card-elevated shadow-border-subtle rounded-3xl w-full max-w-sm p-6 sm:p-7 relative space-y-4 text-center">
        <button type="button" onclick="document.getElementById('qrModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg cursor-pointer" aria-label="Close modal">
            &times;
        </button>
        <div class="space-y-1">
            <h4 class="text-base font-bold text-slate-900 dark:text-white" id="qrModalTitle">Quick QR Code</h4>
            <p class="text-xs text-slate-500" id="qrModalSubtitle"></p>
        </div>
        <div class="p-3.5 bg-white rounded-2xl shadow-sm inline-flex items-center justify-center mx-auto shadow-border-subtle">
            <div id="modalQrCode"></div>
        </div>
        <div>
            <button type="button" onclick="document.getElementById('qrModal').classList.add('hidden')" class="w-full text-xs font-semibold py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/[0.1] shadow-border-subtle transition cursor-pointer">
                Close
            </button>
        </div>
    </div>
</div>

<div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141413] shadow-card-elevated shadow-border-subtle rounded-3xl w-full max-w-md p-6 sm:p-8 relative space-y-6">
        <button type="button" onclick="document.getElementById('authModal').classList.add('hidden')" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg cursor-pointer" aria-label="Close modal">
            &times;
        </button>

        <div class="flex shadow-[0_1px_0_0_var(--color-border-faint)]">
            <button type="button" id="tabLogin" class="flex-1 pb-3 text-sm font-bold text-brand-600 dark:text-brand-400 border-b-2 border-brand-500 cursor-pointer">
                Sign In
            </button>
            <button type="button" id="tabRegister" class="flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-slate-600 dark:hover:text-white border-b-2 border-transparent cursor-pointer">
                Register
            </button>
        </div>

        <div id="authErrorBanner" class="hidden p-4 rounded-2xl bg-rose-500/10 shadow-border-subtle text-rose-600 dark:text-rose-300 text-xs"></div>

        <form id="authForm" class="space-y-4">
            <div class="space-y-2">
                <label for="authEmail" class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Email Address</label>
                <input type="email" id="authEmail" required class="w-full bg-slate-50 dark:bg-black/50 shadow-border-subtle focus:shadow-focus rounded-2xl px-4 py-3 text-sm outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition">
            </div>

            <div class="space-y-2">
                <label for="authPassword" class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Password</label>
                <input type="password" id="authPassword" required minlength="6" class="w-full bg-slate-50 dark:bg-black/50 shadow-border-subtle focus:shadow-focus rounded-2xl px-4 py-3 text-sm outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition">
            </div>

            <button type="submit" id="authSubmitBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 rounded-2xl transition text-sm sm:text-base cursor-pointer shadow-lg shadow-brand-600/20 active:scale-[0.98]">
                <span id="authSubmitText">Sign In</span>
            </button>
        </form>
    </div>
</div>

<!-- Password Entry Modal (Catches 401 Unauthenticated Redirects) -->
<div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141413] shadow-card-elevated shadow-border-subtle rounded-3xl w-full max-w-md p-6 sm:p-8 relative space-y-6">
        <button type="button" onclick="closePasswordModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg cursor-pointer" aria-label="Close password modal">
            &times;
        </button>

        <div class="space-y-1.5">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span>Password Protected Link</span>
            </div>
            <h3 id="passwordModalTitle" class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">Unlock Destination</h3>
            <p id="passwordModalSubtitle" class="text-xs sm:text-sm text-slate-500 leading-relaxed">This short URL requires an access password to proceed to its target destination.</p>
        </div>

        <div id="passwordModalError" class="hidden p-3.5 rounded-2xl bg-rose-500/10 shadow-border-subtle text-rose-600 dark:text-rose-300 text-xs"></div>

        <form id="passwordPromptForm" class="space-y-4">
            <input type="hidden" id="passwordModalShortCode" value="">
            <div class="space-y-2">
                <label for="linkPasswordInput" class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Access Password</label>
                <input 
                    type="password" 
                    id="linkPasswordInput" 
                    required 
                    placeholder="Enter link password" 
                    autocomplete="current-password"
                    class="w-full bg-slate-50 dark:bg-black/50 shadow-border-subtle focus:shadow-focus rounded-2xl px-4 py-3 text-sm outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition"
                >
            </div>

            <div class="space-y-2.5 pt-1">
                <button type="submit" id="passwordSubmitBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-2xl transition text-sm cursor-pointer shadow-lg shadow-brand-600/20 active:scale-[0.98]">
                    <span id="passwordSubmitText">Access Destination</span>
                </button>
                <button type="button" onclick="closePasswordModal()" class="w-full text-xs font-semibold py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/[0.1] shadow-border-subtle transition cursor-pointer">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Destination Modal -->
<div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141413] shadow-card-elevated shadow-border-subtle rounded-3xl w-full max-w-md p-6 sm:p-8 relative space-y-6">
        <button type="button" onclick="closeEditModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg cursor-pointer" aria-label="Close edit modal">
            &times;
        </button>

        <div class="space-y-1.5">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-500/10 text-brand-600 dark:text-brand-400 text-xs font-bold">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span>Edit Link Destination</span>
            </div>
            <h3 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">Update Target URL</h3>
            <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                Change the destination address for <span id="editModalShortCode" class="font-mono font-bold text-brand-600 dark:text-brand-400"></span> without changing the short link.
            </p>
        </div>

        <div id="editModalError" class="hidden p-3.5 rounded-2xl bg-rose-500/10 shadow-border-subtle text-rose-600 dark:text-rose-300 text-xs"></div>

        <form id="editDestinationForm" class="space-y-4">
            <input type="hidden" id="editShortCodeInput" value="">
            <div class="space-y-2">
                <label for="editDestinationUrl" class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">New Target Destination URL</label>
                <input 
                    type="url" 
                    id="editDestinationUrl" 
                    required 
                    placeholder="https://example.com/updated-destination" 
                    class="w-full bg-slate-50 dark:bg-black/50 shadow-border-subtle focus:shadow-focus rounded-2xl px-4 py-3 text-sm outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition"
                >
            </div>

            <div class="space-y-2.5 pt-1">
                <button type="submit" id="editSubmitBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-2xl transition text-sm cursor-pointer shadow-lg shadow-brand-600/20 active:scale-[0.98]">
                    <span id="editSubmitText">Save Destination</span>
                </button>
                <button type="button" onclick="closeEditModal()" class="w-full text-xs font-semibold py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.06] text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/[0.1] shadow-border-subtle transition cursor-pointer">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
