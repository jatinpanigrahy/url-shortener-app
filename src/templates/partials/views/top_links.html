<section id="viewTopLinks" class="hidden space-y-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="space-y-1.5">
            <div class="inline-flex items-center gap-2">
                <span class="text-[11px] font-bold uppercase tracking-wider bg-brand-500/10 text-brand-600 dark:text-brand-400 shadow-border-subtle px-2.5 py-1 rounded-lg">Leaderboard</span>
            </div>
            <h2 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">Platform Leaderboard</h2>
            <p class="text-sm sm:text-base text-slate-500">Platform-wide leaderboard showing the most visited links and traffic distribution</p>
        </div>
        <button type="button" onclick="loadPlatformAnalytics()" class="text-xs sm:text-sm font-semibold px-5 py-2.5 rounded-2xl bg-slate-100 dark:bg-white/[0.06] hover:bg-slate-200 dark:hover:bg-white/[0.1] text-slate-700 dark:text-slate-200 shadow-border-subtle transition cursor-pointer self-start sm:self-auto active:scale-[0.98]">
            Refresh
        </button>
    </div>

    <!-- Leaderboard Command Center Card -->
    <div class="bg-canvas-elevated dark:bg-white/[0.03] shadow-card-elevated rounded-3xl p-6 sm:p-10 overflow-hidden transition">
        <div class="overflow-x-auto shadow-border-subtle rounded-2xl">
            <table class="w-full text-left text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                <thead class="text-slate-400 uppercase tracking-wider shadow-[0_1px_0_0_var(--color-border-faint)] text-[11px] font-bold">
                    <tr>
                        <th class="py-4 px-4 w-12">#</th>
                        <th class="py-4 px-4">Link &amp; Target Domain</th>
                        <th class="py-4 px-4">Lifecycle</th>
                        <th class="py-4 px-4 min-w-[160px]">Traffic</th>
                        <th class="py-4 px-4 text-right">Total Clicks</th>
                        <th class="py-4 px-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="topUrlsTableBody" class="divide-y divide-slate-100 dark:divide-white/[0.05]"></tbody>
            </table>
        </div>
        <div id="emptyTopUrlsMessage" class="hidden text-center py-12 text-xs sm:text-sm text-slate-500">
            No link activity recorded yet.
        </div>
    </div>
</section>
