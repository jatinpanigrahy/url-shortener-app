<header id="mainHeader" class="sticky top-0 z-50 border-b border-slate-200/80 dark:border-white/[0.08] bg-canvas-base/85 dark:bg-[#000000]/85 backdrop-blur-md data-[scrolled=true]:backdrop-blur-[12px] transition-all duration-200">
    <style>
        #mainHeader[data-scrolled="true"] {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(250, 249, 245, 0.85);
        }
        .dark #mainHeader[data-scrolled="true"] {
            background-color: rgba(0, 0, 0, 0.85);
        }
    </style>
    <div class="max-w-6xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-3 sm:gap-4">
        <div class="flex items-center gap-3 cursor-pointer shrink-0" onclick="navigateTo('/')">
            <div class="w-9 h-9 rounded-2xl bg-brand-600 flex items-center justify-center text-white font-extrabold text-base shadow-sm">
                /
            </div>
            <span class="font-extrabold tracking-tight text-slate-900 dark:text-white text-lg sm:text-xl whitespace-nowrap">URL Shortener</span>
        </div>

        <nav class="hidden lg:flex items-center gap-1.5 bg-slate-100/90 dark:bg-white/[0.04] p-1.5 rounded-2xl border border-slate-200/80 dark:border-white/[0.08] shadow-sm shrink-0">
            <button type="button" id="tabNavShortener" onclick="navigateTo('/shortener')" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl bg-white dark:bg-white/[0.08] shadow-sm text-brand-600 dark:text-brand-400 cursor-pointer transition">
                Shorten
            </button>
            <button type="button" id="tabNavMyLinks" onclick="navigateTo('/my-links')" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer transition">
                My Links
            </button>
            <button type="button" id="tabNavTopLinks" onclick="navigateTo('/top-links')" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer transition">
                Top Links
            </button>
            <button type="button" id="tabNavAbout" onclick="navigateTo('/about')" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer transition">
                About
            </button>
            <button type="button" id="tabNavProfile" onclick="navigateTo('/profile')" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer transition">
                Profile
            </button>
            <button type="button" id="tabNavAdmin" onclick="navigateTo('/admin')" class="hidden text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-xl text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 cursor-pointer transition">
                Admin Dashboard
            </button>
        </nav>

        <div class="flex items-center gap-2.5 shrink-0">
            <button type="button" id="themeToggleBtn" class="p-2.5 rounded-2xl border border-slate-200 dark:border-white/[0.08] bg-white dark:bg-white/[0.04] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/[0.08] transition cursor-pointer shrink-0 inline-flex items-center justify-center" title="Toggle color theme">
                <svg id="themeIconSun" class="hidden w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="themeIconMoon" class="hidden w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>

            <button type="button" id="mobileMenuBtn" class="lg:hidden p-2.5 rounded-2xl border border-slate-200 dark:border-white/[0.08] bg-white dark:bg-white/[0.04] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/[0.08] transition cursor-pointer shrink-0 inline-flex items-center justify-center" title="Open Menu">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <div id="navGuest" class="shrink-0">
                <button type="button" id="openAuthBtn" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-4 sm:px-5 py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-500 text-white transition cursor-pointer shadow-md shadow-brand-600/20 active:scale-[0.98]">
                    Sign In / Register
                </button>
            </div>
            <div id="navAuth" class="hidden flex items-center gap-2 shrink-0">
                <span id="userEmailBadge" class="hidden sm:inline-block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 bg-white dark:bg-white/[0.04] border border-slate-200 dark:border-white/[0.08] px-3 py-2 rounded-2xl max-w-[120px] md:max-w-[150px] truncate whitespace-nowrap"></span>
                <button type="button" id="logoutBtn" class="text-xs sm:text-sm font-semibold whitespace-nowrap px-3.5 py-2 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/20 transition cursor-pointer shrink-0">
                    Log Out
                </button>
            </div>
        </div>
    </div>

    <div id="mobileMenu" class="hidden lg:hidden border-t border-slate-200/80 dark:border-white/[0.08] bg-canvas-base dark:bg-[#000000] px-4 py-4 space-y-2">
        <button type="button" onclick="navigateTo('/shortener')" class="block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-white/[0.06] transition">
            Shorten
        </button>
        <button type="button" onclick="navigateTo('/my-links')" class="block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-white/[0.06] transition">
            My Links
        </button>
        <button type="button" onclick="navigateTo('/top-links')" class="block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-white/[0.06] transition">
            Top Links
        </button>
        <button type="button" onclick="navigateTo('/about')" class="block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-white/[0.06] transition">
            About
        </button>
        <button type="button" onclick="navigateTo('/profile')" class="block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-white/[0.06] transition">
            Profile
        </button>
        <button type="button" id="mobileNavAdmin" onclick="navigateTo('/admin')" class="hidden block w-full text-left text-sm font-semibold px-4 py-3 rounded-xl text-brand-600 dark:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition">
            Admin Dashboard
        </button>
    </div>
</header>
