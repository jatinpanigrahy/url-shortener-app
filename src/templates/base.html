<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='12' fill='%232563eb'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900' font-size='22'>/</text></svg>">    
    <title>{% block title %}URL Shortener{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/500.css" rel="stylesheet">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="min-h-full flex flex-col justify-between bg-canvas-base text-ink font-sans antialiased transition-colors duration-200 relative">

    {% include "partials/header.html" %}

    <main class="flex-grow bg-grid-pattern py-12 sm:py-20 relative z-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="bg-canvas-base border-t border-slate-200/80 dark:border-white/[0.08] py-8 text-center text-xs text-slate-500 relative z-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 font-medium">
            <span>URL Shortener &bull; Built with Python, Flask &amp; SQLite</span>
            <div class="flex items-center gap-4">
                <a href="https://github.com/jatinpanigrahy/url-shortener-app" target="_blank" class="hover:underline">GitHub Repository</a>
                <span>&bull;</span>
                <span onclick="navigateTo('/about')" class="cursor-pointer hover:underline">About &amp; Privacy</span>
            </div>
        </div>
    </footer>

    {% include "partials/modal.html" %}
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/shortener.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/router.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
